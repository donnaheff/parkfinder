name: CI

on:
  pull_request:
    paths:
      - 'smart-parking-finder/**'
      - '.github/workflows/ci.yml'
  push:
    branches: [main]
    paths:
      - 'smart-parking-finder/**'
      - '.github/workflows/ci.yml'

defaults:
  run:
    working-directory: smart-parking-finder

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: smart-parking-finder/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
