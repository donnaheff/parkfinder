name: CI

on:
  pull_request:
    paths:
      - 'smart-parking-finder/**'
      - '.github/workflows/ci.yml'
  push:
    branches: [main]
    paths:
      - 'smart-parking-finder/**'
      - '.github/workflows/ci.yml'

defaults:
  run:
    working-directory: smart-parking-finder

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: smart-parking-finder/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run e2e tests
        run: npx playwright test
        env:
          CI: true
          # e2e/auth-flows.spec.js self-skips unless all four of these are set as
          # repo/environment secrets against a real Supabase test project (see
          # e2e/auth-flows.spec.js for what each needs). e2e/smoke.spec.js always runs.
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
          E2E_OWNER_EMAIL: ${{ secrets.E2E_OWNER_EMAIL }}
          E2E_OWNER_PASSWORD: ${{ secrets.E2E_OWNER_PASSWORD }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: smart-parking-finder/playwright-report/
          retention-days: 7
